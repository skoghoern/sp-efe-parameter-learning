[project]
name = "sp-efe-parameter-learning"
version = "1.0.0"
description = "Parameter Learning in Active Inference via Variational Message Passing (IWAI 2026) — experiment code"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "jax>=0.6.2",
    "jaxtyping>=0.3.11",
    "matplotlib>=3.10.8",
    "numpy>=2.0",
]

[tool.setuptools.packages.find]
include = ["environments*", "inference*"]

[tool.pyright]
venvPath = "."
venv = ".venv"

[tool.basedpyright]
venvPath = "."
venv = ".venv"

[dependency-groups]
dev = ["pytest>=8.0"]
cuda = ["jax[cuda12-pip]>=0.9.0"]
macos = ["jax-mps>=0.9.6"]
